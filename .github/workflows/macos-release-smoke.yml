name: ShowCase macOS release verification

on:
  push:
    branches:
      - codex/showcase-macos-release-smoke

permissions:
  contents: write

jobs:
  signed-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
            major: '15'
          - runner: macos-15
            architecture: arm64
            major: '15'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      CANDIDATE_SHA256: ae78a10a76bee6cacd6a87f5e7039afd944f36f7bb661ccd5d14dddde1e6c0bf
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Fetch the pinned macOS release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Dobbs3313/ShowCase-releases
          gh api "repos/$GITHUB_REPOSITORY/releases/448333990" |
            jq -e --arg digest "sha256:$CANDIDATE_SHA256" '
              .draft and .tag_name=="v1.1.6"
              and any(.assets[]; .id==758227623 and .digest==$digest and .size==287490821)
            ' >/dev/null
          work="$RUNNER_TEMP/showcase-release"
          mkdir -p "$work"
          cd "$work"
          gh api --header 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/758227623" > ShowCase-macOS-universal.zip
          printf '%s  %s\n' "$CANDIDATE_SHA256" ShowCase-macOS-universal.zip | shasum -a 256 -c -
          /usr/bin/ditto -x -k ShowCase-macOS-universal.zip .
      - name: Check the signed app and offline media on this host
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_MAJOR: ${{ matrix.major }}
        shell: bash
        run: |
          bash scripts/check-macos-release.sh "$RUNNER_TEMP/showcase-release/ShowCase.app" \
            "$EXPECTED_ARCHITECTURE" "$EXPECTED_MAJOR"
