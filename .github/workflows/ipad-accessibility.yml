name: ShowCase iPad accessibility

on:
  push:
    branches:
      - codex/showcase-ipad-accessibility-smoke

permissions:
  contents: write

jobs:
  tablet-accessibility:
    runs-on: xcode-27
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CANDIDATE_RELEASE: '448476777'
      CANDIDATE_TAG: 'qa-ios27-ipad-ax-20261117-candidate-retest-b30'
      CANDIDATE_ASSET: '758632848'
      CANDIDATE_SHA256: 'bc65617bd408983df19277f93ab778e15b1ca3d33610e59ba95c035f534f62e0'
      CANDIDATE_BYTES: '126852167'
      CANDIDATE_BUILD: '30'
      CANDIDATE_APP_SHA256: '2b052ee8572245f29ce7ae0861a65ed706f9ca58723d70bc9aae3774596b030a'
      TEST_METHOD: 'testTabletGuideAndWorkspaceExposeNavigationActions'
      QA_PHASE: 'candidate-retest'
    steps:
      - name: Verify and extract the private simulator bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Dobbs3313/ShowCase-releases
          test "$(uname -m)" = arm64
          xcodebuild -version | grep -Fx 'Build version 27B52'
          gh api "repos/$GITHUB_REPOSITORY/releases/$CANDIDATE_RELEASE" |
            jq -e --arg tag "$CANDIDATE_TAG" --arg sha "sha256:$CANDIDATE_SHA256" \
              --argjson asset "$CANDIDATE_ASSET" --argjson bytes "$CANDIDATE_BYTES" '
              .draft and .tag_name == $tag
              and any(.assets[]; .id == $asset and .digest == $sha and .size == $bytes)
            ' >/dev/null
          work="$RUNNER_TEMP/showcase-ios27-ax"
          mkdir -m 700 "$work"
          cd "$work"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$CANDIDATE_ASSET" > simulator.zip
          printf '%s  %s\n' "$CANDIDATE_SHA256" simulator.zip | shasum -a 256 -c -
          ditto -x -k simulator.zip .
          printf '%s  %s\n' "$CANDIDATE_APP_SHA256" Runner.app/Frameworks/App.framework/App | shasum -a 256 -c -
          xcrun lipo -verify_arch arm64 Runner.app/Runner
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' Runner.app/Info.plist)" = com.arisparty.showcase
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Runner.app/Info.plist)" = "$CANDIDATE_BUILD"
      - name: Run the iPad accessibility check
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/showcase-ios27-ax"
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-27-2
          device_type="$(xcrun simctl list -j devicetypes | jq -er '.devicetypes[] | select(.name=="iPad Pro 11-inch (M5)") | .identifier')"
          xcrun simctl list -j runtimes | jq -e --arg runtime "$runtime" \
            'any(.runtimes[]; .identifier == $runtime and .isAvailable)' >/dev/null
          device="$(xcrun simctl create "ShowCase iPad Accessibility QA" "$device_type" "$runtime")"
          cleanup() {
            xcrun simctl shutdown "$device" || true
            xcrun simctl delete "$device" || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b > boot.log 2>&1
          echo 'Disposable iPad simulator booted'
          xcrun simctl install "$device" Runner.app
          echo 'ShowCase simulator app installed'
          status=0
          xcodebuild test-without-building -xctestrun Harness/Tests.xctestrun \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            "-only-testing:ShowCaseTestFlightUITests/ShowCaseTutorialAccessibilityUITests/$TEST_METHOD" \
            -resultBundlePath tutorial.xcresult > tutorial.log 2>&1 || status=$?
          grep -E 'Test Case.*(started|passed|failed)|Executed [0-9]+ tests?|\*\* TEST (SUCCEEDED|FAILED)|QA recorded|error:.*(Simulator|did not|failed|XCTAssert)' tutorial.log | tail -30 || true
          if test -d tutorial.xcresult; then
            xcrun xcresulttool get test-results summary --path tutorial.xcresult --compact |
              jq '{result,totalTestCount,passedTests,failedTests,devices:[.devicesAndConfigurations[]?.device|{modelName,osVersion}]}'
          fi
          test "$status" = 0
          grep -Eq 'Executed 1 test, with 0 failures' tutorial.log
      - name: Retain the synthetic snapshots in the private draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/showcase-ios27-ax"
          test -f "$work/tutorial.log" || exit 0
          test "$GITHUB_REPOSITORY" = Dobbs3313/ShowCase-releases
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$CANDIDATE_RELEASE")"
          jq -e --arg tag "$CANDIDATE_TAG" '.draft and .tag_name == $tag' <<< "$release" >/dev/null
          cd "$work"
          archive="synthetic-ipad-$QA_PHASE-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          files=(boot.log tutorial.log)
          if test -d tutorial.xcresult; then files+=(tutorial.xcresult); fi
          tar -czf "$archive" "${files[@]}"
          gh release upload "$CANDIDATE_TAG" "$archive" --repo "$GITHUB_REPOSITORY"
